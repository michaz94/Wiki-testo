<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#000000">
  <title>Wiki</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* print-only styles for PDF export */
    @media print {
      .header-stack, .read-actions, .fab, .toolbar, .overlay, .drawer-overlay, .toast, .save-page, .quick-page-menu { display: none !important; }
      html, body { background: var(--project-bg, #111) !important; }
      .page-body { max-width: 100% !important; margin: 0 !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="empty">Chargement...</div>
  </div>

  <noscript>Cette application nécessite JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(error => {
          console.error('Erreur Service Worker :', error);
        });
      });
    }
  </script>
</body>
</html>
