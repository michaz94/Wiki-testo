<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0c0c0c">
  <title>Wiki</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    /* print-only styles for PDF export */
    @media print {
      .header-stack, .read-actions, .fab, .toolbar, .overlay, .drawer-overlay, .toast, .save-page, .quick-page-menu { display: none !important; }
      html, body { background: var(--project-bg, #111) !important; }
      .page-body { max-width: 100% !important; margin: 0 !important; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="empty">Chargement...</div>
  </div>

  <noscript>Cette application nécessite JavaScript.</noscript>
  <script type="module" src="./app.js"></script>
  <script>
    /* Mise à jour en deux temps : le nouveau service worker s'installe
       en silence, puis l'app propose « Recharger ». Rien n'est coupé
       en pleine saisie. */
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(registration => {
          const promptReload = () => {
            const waiting = registration.waiting;
            if (!waiting || document.querySelector('.sw-banner')) return;

            const bar = document.createElement('div');
            bar.className = 'sw-banner';
            bar.innerHTML = '<span>Nouvelle version disponible</span><button type="button">Recharger</button>';
            document.body.appendChild(bar);
            requestAnimationFrame(() => bar.classList.add('show'));

            bar.querySelector('button').onclick = () => {
              waiting.addEventListener('statechange', () => {
                if (waiting.state === 'activated') window.location.reload();
              });
              waiting.postMessage('SKIP_WAITING');
            };
          };

          if (registration.waiting && navigator.serviceWorker.controller) promptReload();

          registration.addEventListener('updatefound', () => {
            const installing = registration.installing;
            if (!installing) return;
            installing.addEventListener('statechange', () => {
              if (installing.state === 'installed' && navigator.serviceWorker.controller) promptReload();
            });
          });
        }).catch(error => {
          console.error('Erreur Service Worker :', error);
        });
      });
    }
  </script>
</body>
</html>
